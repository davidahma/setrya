name: Setrya erasure
on: pull_request
permissions: {}
jobs:
  drill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.erasure.outputs.exit-code }}
      review: ${{ steps.erasure.outputs.review-status }}
      evidence: ${{ steps.erasure.outputs.evidence-summary }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install setrya==1.15.0
      - id: erasure
        uses: davidahma/setrya@661d8826caad3ac5a081ed60f895f061cfc15bce # 1.15.0
        with:
          starter: setrya-case/test_erasure.py
          mode: deletion
          output: ${{ runner.temp }}/setrya-receipt
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.erasure.outputs.review-status != '' && steps.erasure.outputs.review-status != 'UNAVAILABLE' }}
        with:
          name: setrya-receipt
          path: ${{ runner.temp }}/setrya-receipt/
          if-no-files-found: error
  comment:
    needs: drill
    concurrency:
      group: setrya-verdict-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: davidahma/setrya@661d8826caad3ac5a081ed60f895f061cfc15bce # 1.15.0
        with:
          operation: comment
          token: ${{ github.token }}
          exit-code: ${{ needs.drill.outputs.code || '2' }}
          review-status: ${{ needs.drill.outputs.review || 'UNAVAILABLE' }}
          evidence-summary: ${{ needs.drill.outputs.evidence }}
          artifact-id: ${{ needs.drill.outputs.artifact }}
