name: Setrya copy coverage
on: pull_request
permissions: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      summary: ${{ steps.scan.outputs.copy-summary }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install setrya==1.15.0
      - id: scan
        uses: davidahma/setrya@248086d951f94bc960080545a6cc797b341287b7 # 1.15.0
        with:
          operation: copy-scan
          base: ${{ github.event.pull_request.base.sha }}
          candidate: ${{ github.event.pull_request.head.sha }}
          copy-output: ${{ runner.temp }}/setrya-copy-report.json
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: setrya-copy-report
          path: ${{ runner.temp }}/setrya-copy-report.json
          if-no-files-found: error
  comment:
    needs: scan
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    concurrency:
      group: setrya-copy-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: davidahma/setrya@248086d951f94bc960080545a6cc797b341287b7 # 1.15.0
        with:
          operation: copy-comment
          token: ${{ github.token }}
          copy-summary: ${{ needs.scan.result == 'success' && needs.scan.outputs.summary || 'error' }}
          artifact-id: ${{ needs.scan.outputs.artifact }}
