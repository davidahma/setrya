version = 1

[adapter]
factory = "examples.support_search.adapter:http_fixture"

[adapter.options]
mode = "fixed"
scenario = "retired"

[rules]
id = "retired-chunks"
document = "refund"
old_revision = "A"
new_revision = "B"
checkpoint = "after_source_read"
freshness_probe = "refund-window"
freshness_ms = 1200
checkpoint_ms = 2000
settle_ms = 2000
sample_ms = 20
max_gap_ms = 225

[[probe]]
id = "refund-window"
route = "support-search"
scope = "support-agent"
question = "What is the return policy for an order?"
top_k = 5
before = ["refund@A"]
require = ["refund@B"]
forbid = ["refund@A"]

[[probe]]
id = "retired-clause"
route = "support-search"
scope = "support-agent"
question = "Does the return policy include the warehouse express clause?"
top_k = 5
before = ["refund@A.5"]
require = ["refund@B"]
forbid = ["refund@A.5"]

[[probe]]
id = "delivery"
route = "support-search"
scope = "support-agent"
question = "When can I track my delivery?"
top_k = 3
before = ["delivery@1"]
require = ["delivery@1"]
forbid = []
