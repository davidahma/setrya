services:
  database:
    image: cgr.dev/chainguard/postgres:latest@sha256:9cc085289d7ef0174f35f2ff1e514624c3305c4a26215d8e89e3e277e3377d03
    user: "postgres"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    mem_limit: 1g
    pids_limit: 256
    environment:
      POSTGRES_USER: opendesk
      POSTGRES_DB: opendesk
      POSTGRES_PASSWORD: ${TRIAL_DATABASE_PASSWORD:?generated by run.py}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "opendesk", "-d", "opendesk"]
      interval: 2s
      timeout: 2s
      retries: 45
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700
      - /var/run/postgresql:uid=70,gid=70,mode=0755
      - /tmp:mode=1777

  model:
    image: cgr.dev/chainguard/python:latest@sha256:d2711a21a494fa5c2efbfcf4226268395bad5d03406083ed0f3e7bed5199cfb2
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    command: ["-B", "/stub/provider.py"]
    user: "65534:65534"
    read_only: true
    volumes:
      - ./provider.py:/stub/provider.py:ro
      - ./transport.py:/stub/transport.py:ro

  app:
    image: ghcr.io/useopendesk/opendesk:v0.4.14@sha256:cb60703a043dc2afa9fb3266e93079813be3e171ed70177e2d4ac47cb266f4d8
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    mem_limit: 1g
    pids_limit: 256
    environment:
      OPENDESK_ROLE: all
      OPENDESK_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://opendesk:${TRIAL_DATABASE_PASSWORD:?generated by run.py}@database:5432/opendesk?sslmode=disable
      AUTH_SECRET: ${TRIAL_AUTH_SECRET:?generated by run.py}
      CREDENTIALS_KEY: ${TRIAL_CREDENTIALS_KEY:?generated by run.py}
      NATS_TOKEN: ${TRIAL_NATS_TOKEN:?generated by run.py}
      DATA_DIR: /data
      MAIL_DRIVER: log
      UPDATE_CHECK: "false"
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${TRIAL_MODEL_KEY:?generated by run.py}
      OPENAI_BASE_URL: http://model:8000/v1
      AI_MODEL: setrya-fixture
      AI_FAST_MODEL: setrya-fixture
    depends_on:
      database:
        condition: service_healthy
      model:
        condition: service_started

networks:
  default:
    internal: true
