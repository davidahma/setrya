name: Offboarding trial image audit

on:
  schedule:
    - cron: '27 9 * * 4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - setrya/examples/opendesk/compose.yaml
      - setrya/examples/opendesk/Dockerfile.trial
      - setrya/examples/opendesk/verify_report.py
      - .github/scripts/audit-trial-images.sh
      - .github/workflows/offboarding-trial-images.yml
  pull_request:
    paths:
      - setrya/examples/opendesk/compose.yaml
      - setrya/examples/opendesk/Dockerfile.trial
      - setrya/examples/opendesk/verify_report.py
      - .github/scripts/audit-trial-images.sh
      - .github/workflows/offboarding-trial-images.yml

permissions:
  contents: read

jobs:
  audit:
    name: Image inventory (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified scanner releases
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir trial-scanners
          cd trial-scanners
          install_scanner() {
            local tool="$1" version="$2" sha="$3" archive="${1}_${2}_linux_amd64.tar.gz"
            curl --fail --silent --show-error --location --proto '=https' --retry 3 \
              "https://github.com/anchore/$tool/releases/download/v$version/$archive" --output "$archive"
            printf '%s  %s\n' "$sha" "$archive" | sha256sum --check -
            tar -xzf "$archive" "$tool"
          }
          install_scanner syft 1.57.2 ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b
          install_scanner grype 0.122.1 f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538
          echo "$RUNNER_TEMP/trial-scanners" >> "$GITHUB_PATH"
      - name: Fetch current vulnerability database
        env:
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/trial-vulnerability-db
          GRYPE_DB_REQUIRE_UPDATE_CHECK: 'true'
        run: grype db update
      - name: Scan the pinned trial images
        env:
          ARCH: ${{ matrix.arch }}
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/trial-vulnerability-db
          GRYPE_DB_AUTO_UPDATE: 'false'
        run: bash .github/scripts/audit-trial-images.sh "$ARCH" image-audit
      - name: Save package inventories, full reports and decisions
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trial-images-${{ matrix.arch }}
          path: image-audit/
          if-no-files-found: error
          retention-days: 30
