name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Record Python and SQLite versions
        run: python3 -c 'import platform, sqlite3, sys; print(platform.platform(), sys.version.split()[0], sqlite3.sqlite_version)'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m setrya qualify --quick
      - name: Check Linux qualification privileges and network isolation
        if: runner.os == 'Linux' && matrix.python == '3.11'
        run: scripts/qualify-offline.sh --case late-write
      - name: Publish synthetic replay evidence
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.python == '3.11' }}
        run: python3 -m setrya check setrya/examples/support-search/drill.toml --report run.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Capture a known failing check
        id: failing_evidence
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.python == '3.11' }}
        continue-on-error: true
        run: |
          sed 's/mode = "fixed"/mode = "broken"/' setrya/examples/support-search/drill.toml > "$RUNNER_TEMP/setrya-broken.toml"
          python3 -m setrya check "$RUNNER_TEMP/setrya-broken.toml" --report run.failed.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.python == '3.11' }}
        with:
          name: synthetic-search-report
          path: |
            run.json
            run.failed.json
          if-no-files-found: error
      - name: Verify the saved failure replays
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.python == '3.11' }}
        env:
          CAPTURE_OUTCOME: ${{ steps.failing_evidence.outcome }}
        run: |
          test "$CAPTURE_OUTCOME" = failure
          status=0
          python3 -m setrya replay run.failed.json || status=$?
          test "$status" -eq 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with the default rules
        shell: bash
        env:
          SCANNER_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          installer="$RUNNER_TEMP/install-gitleaks.sh"
          if git cat-file -e "$SCANNER_REVISION:.github/scripts/install-gitleaks.sh"; then
            git show "$SCANNER_REVISION:.github/scripts/install-gitleaks.sh" > "$installer"
          else
            # Pin the first installer when adding the check to an older base.
            cp .github/scripts/install-gitleaks.sh "$installer"
            echo "908cf65d7eaeb94bcdcff18889e1bde3c2e32ba07b7cd2cde4ea2225dc39e817  $installer" | sha256sum -c -
          fi
          bash "$installer"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          : > "$RUNNER_TEMP/no-ignored-commits"
          "$RUNNER_TEMP/setrya-tools/gitleaks" git --no-banner --redact --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/no-ignored-commits" \
            --log-opts="--all HEAD" .

  pgvector:
    name: PostgreSQL and pgvector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_DB: setrya_fixture
          POSTGRES_USER: setrya
          POSTGRES_PASSWORD: setrya-local
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U setrya -d setrya_fixture"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install '.[pgvector,pytest]'
      - name: Enable pgvector in the disposable database
        env:
          SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$SERVICE_ID" psql -U setrya -d setrya_fixture -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
      - name: Qualify the pgvector fixture from an unpacked archive
        shell: bash
        env:
          SETRYA_PGVECTOR_DSN: postgresql://setrya:setrya-local@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/setrya_fixture
        run: |
          source_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$source_dir"
          cd "$source_dir"
          python3 -m setrya qualify --case pgvector
          python3 -m setrya.examples.pgvector_search.benchmark --repeats 3 --output "$RUNNER_TEMP/setrya-benchmark"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: pgvector-benchmark
          path: ${{ runner.temp }}/setrya-benchmark/
          if-no-files-found: warn

  elasticsearch:
    name: Elasticsearch native visibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run both visibility tiers on one disposable shard
        shell: bash
        run: |
          node=$(docker run --rm -d -p 127.0.0.1::9200 \
            -e discovery.type=single-node -e xpack.security.enabled=false -e xpack.ml.enabled=false \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            docker.elastic.co/elasticsearch/elasticsearch:8.19.12@sha256:6711d4eff91dce95b900eb3c771c5298672ba00f6d20cab79551c4acc133f629)
          trap 'docker stop "$node" >/dev/null' EXIT
          endpoint=$(docker port "$node" 9200/tcp)
          export SETRYA_ELASTICSEARCH_PORT="${endpoint##*:}"
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 "http://$endpoint" >/dev/null
          python3 -m unittest discover -s tests -p test_elasticsearch_store.py -v

  recorded-review:
    name: Recorded pytest review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install '.[pytest]'
      - name: Review access revocation on two SQLite worker commits
        working-directory: ${{ runner.temp }}
        run: python3 "$GITHUB_WORKSPACE/scripts/verify-scenario-review.py" --output "$RUNNER_TEMP/scenario-review"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: scenario-review
          path: ${{ runner.temp }}/scenario-review/
          if-no-files-found: warn
      - name: Run the full test suite with pytest
        run: python3 -m pytest -q
      - name: Run the installed example on two fixture revisions
        working-directory: ${{ runner.temp }}
        run: python3 -m setrya.examples.recorded_search.verify --output "$RUNNER_TEMP/recorded-review"
      - name: Exercise the installed tenant offboarding CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          mkdir examples
          echo 'raise RuntimeError("unexpected generic examples import")' > examples/__init__.py
          python3 -c 'from importlib.metadata import files; assert all(path.parts[0] != "examples" for path in files("setrya"))'
          setrya offboarding demo --output offboarding-example
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-offboarding-example
          path: ${{ runner.temp }}/offboarding-example/
          if-no-files-found: error
      - name: Publish the review summary
        if: ${{ !cancelled() }}
        run: |
          summary="$RUNNER_TEMP/recorded-review/review.md"
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: recorded-pytest-review
          path: ${{ runner.temp }}/recorded-review/
          if-no-files-found: warn

  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [tests, pgvector, elasticsearch, recorded-review, secrets]
    steps:
      - name: Require all matrix cells to pass
        env:
          MATRIX_RESULT: ${{ needs.tests.result }}
          PGVECTOR_RESULT: ${{ needs.pgvector.result }}
          ELASTIC_RESULT: ${{ needs.elasticsearch.result }}
          RECORDED_RESULT: ${{ needs.recorded-review.result }}
          SECRET_SCAN_RESULT: ${{ needs.secrets.result }}
        run: test "$MATRIX_RESULT" = success && test "$PGVECTOR_RESULT" = success && test "$ELASTIC_RESULT" = success && test "$RECORDED_RESULT" = success && test "$SECRET_SCAN_RESULT" = success
