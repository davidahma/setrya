name: Offline qualification

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 14 * * 2'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: qualify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Qualify checkout with loopback only
        run: |
          mkdir release
          python3 -c 'import platform, sqlite3, sys; print(platform.platform(), sys.version.split()[0], sqlite3.sqlite_version)' | tee release/environment.txt
          scripts/qualify-offline.sh | tee release/checkout.txt
      - name: Qualify the unpacked release with loopback only
        run: |
          version="$(python3 -m setrya --version)"
          archive="setrya-${version}.tar.gz"
          git archive --format=tar.gz --prefix="setrya-${version}/" -o "release/$archive" HEAD
          unpack="$(mktemp -d)"
          tar -xzf "release/$archive" -C "$unpack"
          (cd "$unpack/setrya-${version}" && scripts/qualify-offline.sh) | tee release/archive.txt
          (cd release && sha256sum "$archive" > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qualified-release
          path: release/
          if-no-files-found: error

  provenance:
    name: Attest the qualified Python source archive
    needs: qualification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qualified-release
          path: release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'release/setrya-*.tar.gz'
          create-storage-record: false
