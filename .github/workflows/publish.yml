name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to upload
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require a published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git check-ref-format "refs/tags/$TAG"
          [[ "$TAG" == v* ]]
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Match the tag to the package version on the release commit
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          fi
          version=$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
          test "$TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify the exact tag commit in the released quickstart workflow
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          if [[ -f scripts/render-action-workflow.py ]]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern setrya-quickstart.yml --dir "$RUNNER_TEMP"
            python -I scripts/render-action-workflow.py --commit "$COMMIT" --expect "$RUNNER_TEMP/setrya-quickstart.yml"
            if [[ -f docs/examples/copy-pr/setrya.yml ]]; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern setrya-copy-quickstart.yml --dir "$RUNNER_TEMP"
              python -I scripts/render-action-workflow.py --template copy-pr --commit "$COMMIT" --expect "$RUNNER_TEMP/setrya-copy-quickstart.yml"
            fi
          fi
      - name: Build and check both distributions
        run: |
          python -m pip install build twine
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          python -m build
          python -m twine check --strict dist/*
      - name: Test the wheel and source distribution outside the checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: ${{ runner.temp }}
        run: |
          for distribution in "$GITHUB_WORKSPACE/dist/setrya-$VERSION-py3-none-any.whl" "$GITHUB_WORKSPACE/dist/setrya-$VERSION.tar.gz"; do
            envdir=$(mktemp -d)
            python -m venv "$envdir"
            "$envdir/bin/python" -m pip install --no-deps "$distribution"
            test "$("$envdir/bin/setrya" --version)" = "$VERSION"
            if test -f "$GITHUB_WORKSPACE/scripts/verify-installed-v1.py"; then
              "$envdir/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify-installed-v1.py"
            else
              "$envdir/bin/setrya" demo
            fi
            if test -f "$GITHUB_WORKSPACE/setrya/examples/access_demo.py"; then
              "$envdir/bin/setrya" demo access
            fi
            # Manual dispatch can select a historical tag that predates the starter.
            if test -f "$GITHUB_WORKSPACE/scripts/verify-installed-starter.py"; then
              "$envdir/bin/python" -m pip install "${distribution}[pytest]"
              "$envdir/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify-installed-starter.py"
            fi
            if test -d "$GITHUB_WORKSPACE/setrya/erasure"; then
              "$envdir/bin/python" -m pip install "${distribution}[erasure]"
              "$envdir/bin/setrya" init erasure --output "$envdir/starter"
              "$envdir/bin/setrya" demo erasure --output "$envdir/alice"
              "$envdir/bin/setrya" replay "$envdir/alice/guarded"
              if test -f "$GITHUB_WORKSPACE/scripts/verify-installed-discovery.py"; then
                "$envdir/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify-installed-discovery.py"
              fi
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/setrya/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: hashFiles('tests/test_erasure_typescript_starter.py') != ''
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install the public release and check the demo and endpoint starter
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv public-install
          for attempt in {1..10}; do
            if public-install/bin/python -m pip --isolated install --no-cache-dir --index-url https://pypi.org/simple "setrya==$VERSION"; then break; fi
            if [[ "$attempt" == 10 ]]; then exit 1; fi
            sleep 5
          done
          test "$(public-install/bin/setrya --version)" = "$VERSION"
          if test -f "$GITHUB_WORKSPACE/scripts/verify-installed-v1.py"; then
            public-install/bin/python -I "$GITHUB_WORKSPACE/scripts/verify-installed-v1.py"
          else
            public-install/bin/setrya demo
          fi
          if test -f "$GITHUB_WORKSPACE/setrya/examples/access_demo.py"; then
            public-install/bin/setrya demo access
          fi
          if test -f "$GITHUB_WORKSPACE/scripts/verify-installed-starter.py"; then
            public-install/bin/python -m pip --isolated install --no-cache-dir --index-url https://pypi.org/simple "setrya[pytest]==$VERSION"
            public-install/bin/python -I "$GITHUB_WORKSPACE/scripts/verify-installed-starter.py"
          fi
          if test -d "$GITHUB_WORKSPACE/setrya/erasure"; then
            public-install/bin/python -m pip --isolated install --index-url https://pypi.org/simple "setrya[erasure]==$VERSION"
            public-install/bin/setrya init erasure
            public-install/bin/setrya demo erasure --output alice
            public-install/bin/setrya replay alice/guarded
            if test -f "$GITHUB_WORKSPACE/scripts/verify-installed-discovery.py"; then
              public-install/bin/python -I "$GITHUB_WORKSPACE/scripts/verify-installed-discovery.py"
            fi
          fi
          if test -f "$GITHUB_WORKSPACE/tests/test_erasure_typescript_starter.py"; then
            public-install/bin/python -m pip --isolated install --index-url https://pypi.org/simple "setrya[typescript,case-yaml]==$VERSION"
            public-install/bin/setrya init --stack typescript --output demo-ts
            code=0
            public-install/bin/setrya discovery copy-scan demo-ts --language typescript > copy-scan.txt || code=$?
            test "$code" = 3
            grep -F 'node:sqlite.StatementSync.run' copy-scan.txt
            grep -F 'Coverage unknown' copy-scan.txt
            public-install/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_erasure_typescript_starter.py -v
            echo "$RUNNER_TEMP/public-install/bin" >> "$GITHUB_PATH"
          fi
      - name: Commit a TypeScript copy site in a disposable repository
        if: hashFiles('tests/test_erasure_typescript_starter.py') != ''
        id: typescript_revisions
        working-directory: ${{ runner.temp }}
        run: |
          git init -q demo-ts
          git -C demo-ts config user.name 'Setrya release check'
          git -C demo-ts config user.email fixture@example.invalid
          git -C demo-ts commit -qm 'Before adding the app' --allow-empty
          echo "base=$(git -C demo-ts rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git -C demo-ts add fixture.mts
          git -C demo-ts commit -qm 'Add stored answers'
          echo "candidate=$(git -C demo-ts rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./
        if: hashFiles('tests/test_erasure_typescript_starter.py') != ''
        id: typescript_scan
        with:
          operation: copy-scan
          copy-language: typescript
          base: ${{ steps.typescript_revisions.outputs.base }}
          candidate: ${{ steps.typescript_revisions.outputs.candidate }}
          copy-repo: ${{ runner.temp }}/demo-ts
          copy-output: ${{ runner.temp }}/typescript-copy-sites.json
      - name: Verify the released Action detected the committed SQLite writes
        if: hashFiles('tests/test_erasure_typescript_starter.py') != ''
        working-directory: ${{ runner.temp }}
        env:
          VERDICT: ${{ steps.typescript_scan.outputs.exit-code }}
        run: |
          test "$VERDICT" = 3
          jq -e '.languages == ["typescript", "javascript"]
                 and .review_required == 3 and .coverage.unknown_sources == 1
                 and all(.sites[]; .operation == "node:sqlite.StatementSync.run")' typescript-copy-sites.json
