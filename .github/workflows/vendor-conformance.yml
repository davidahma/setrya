name: Vendor conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_DB: setrya_fixture
          POSTGRES_USER: setrya
          POSTGRES_PASSWORD: setrya-local
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U setrya -d setrya_fixture"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      COSIGN_PASSWORD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install the candidate, enable pgvector, and generate a test signing key
        env:
          SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          python -m pip install '.[pgvector,erasure,conformance-mem0]'
          docker exec "$SERVICE_ID" psql -U setrya -d setrya_fixture -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
          cosign generate-key-pair --output-key-prefix "$RUNNER_TEMP/vendor-key"
      - name: Test conformance verdicts, including retained and re-keyed copies
        run: python -m pytest -q tests/test_vendor_conformance.py tests/test_provider_readback.py tests/test_oscal_export.py
      - name: Check the Action against a disposable PostgreSQL vector index
        uses: ./
        env:
          SETRYA_PGVECTOR_DSN: postgresql://setrya:setrya-local@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/setrya_fixture
        with:
          operation: conformance
          conformance-target: pgvector
          conformance-operator: setrya-ci
          conformance-key: ${{ runner.temp }}/vendor-key.key
          output: ${{ runner.temp }}/vendor-reports/pgvector
      - name: Check LangGraph Store through its public API
        run: |
          setrya conformance run --target langgraph-store --operator setrya-ci --key "$RUNNER_TEMP/vendor-key.key" --output "$RUNNER_TEMP/vendor-reports/langgraph-store"
      - name: Detect Mem0's retained history copy
        run: |
          out="$RUNNER_TEMP/vendor-reports/mem0"
          code=0
          setrya conformance run --target mem0 --operator setrya-ci --key "$RUNNER_TEMP/vendor-key.key" --output "$out" || code=$?
          test "$code" -eq 1
          python - "$out/erasure-receipt.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          expected = {"store": "PASS", "index": "PASS", "history": "FAIL"}
          checks = {row["surface"]: row["status"] for row in receipt["checks"]}
          if not all(checks.get(surface) == status for surface, status in expected.items()):
              raise SystemExit(f"Unexpected Mem0 result: {checks}")
          PY
      - name: Verify each signature and replay the file bundle without a service client
        run: |
          for target in pgvector langgraph-store mem0; do
            out="$RUNNER_TEMP/vendor-reports/$target"
            code=0
            env -u SETRYA_PGVECTOR_DSN setrya conformance review "$out" \
              --key "$RUNNER_TEMP/vendor-key.pub" --expect-operator setrya-ci || code=$?
            test "$code" -eq "$([ "$target" = mem0 ] && echo 1 || echo 0)"
          done
          cp "$RUNNER_TEMP/vendor-key.pub" "$RUNNER_TEMP/vendor-reports/ci-fixture.pub"
      - name: Verify a separately recorded rerun with two synthetic signer policies
        run: |
          cosign generate-key-pair --output-key-prefix "$RUNNER_TEMP/rerun-key"
          original="$RUNNER_TEMP/vendor-reports/langgraph-store"
          rerun="$RUNNER_TEMP/linked-rerun"
          setrya conformance run --target langgraph-store --operator synthetic-reviewer \
            --rerun-of "$original" --key "$RUNNER_TEMP/rerun-key.key" --output "$rerun"
          setrya conformance review "$rerun" --key "$RUNNER_TEMP/rerun-key.pub" \
            --against "$original" --against-key "$RUNNER_TEMP/vendor-key.pub" \
            --expect-operator synthetic-reviewer > "$RUNNER_TEMP/linked-review.txt"
          grep -qxF 'Rerun matches original' "$RUNNER_TEMP/linked-review.txt"
      - name: Attach verified evidence to the sample governance ticket
        run: |
          example="$GITHUB_WORKSPACE/docs/examples/governance-handoff/handoff.py"
          sample="$RUNNER_TEMP/governance-handoff"
          mkdir -p "$sample/issuer" "$sample/reviewer"
          (
            cd "$sample/issuer"
            cosign generate-key-pair --output-key-prefix issuer
            python -I "$example" issue exchange --key issuer.key
          )
          cp -R "$sample/issuer/exchange" "$sample/reviewer/exchange"
          cp "$sample/issuer/issuer.pub" "$sample/reviewer/trusted-issuer.pub"
          cd "$sample/reviewer"
          python -I "$example" review exchange --key trusted-issuer.pub > ticket.json
          fingerprint=$(openssl pkey -pubin -in trusted-issuer.pub -outform DER | sha256sum | cut -d ' ' -f 1)
          jq -e '.governance_ticket == "GOV-204" and .control_reference.reference == "ERASURE-07" and
            .control_reference_source == "receipt" and .evidence_kind == "synthetic-drill" and
            .signer.type == "cosign-public-key" and .signer.sha256 == $fingerprint and
            (.verified_at | endswith("+00:00")) and
            .technical_verdict == "PASS" and .review_status == "OPEN_ITEMS" and
            .open_items[0].owner == "platform-team" and .open_items[0].follow_up and
            .open_items[0].evidence == "erasure-receipt.json#/open_items/0"' --arg fingerprint "$fingerprint" ticket.json
          test "$(jq -r .receipt_sha256 ticket.json)" = "$(sha256sum exchange/erasure-receipt.json | cut -d ' ' -f 1)"
          code=0
          setrya receipt verify-exchange exchange --key trusted-issuer.pub --case-review || code=$?
          test "$code" -eq 3
          code=0
          python -I "$example" review exchange --key "$RUNNER_TEMP/rerun-key.pub" > rejected.json || code=$?
          test "$code" -eq 2
          test ! -s rejected.json
          setrya receipt pack "$RUNNER_TEMP/vendor-reports/mem0" --output vendor-exchange \
            --system mem0 --system-version local-fixture --key "$sample/issuer/issuer.key"
          python -I "$example" review vendor-exchange --key trusted-issuer.pub \
            --ticket GOV-205 --framework "Support governance" --control ERASURE-08 > vendor-ticket.json
          jq -e '.governance_ticket == "GOV-205" and .control_reference.reference == "ERASURE-08" and
            .control_reference_source == "reviewer" and .evidence_kind == "vendor-attestation" and
            .signer.sha256 == $fingerprint and .technical_verdict == "FAIL" and
            .vendor.target == "mem0" and .vendor.execution.operator == "setrya-ci" and
            any(.vendor.checks[]; .surface == "history" and .status == "FAIL")' \
            --arg fingerprint "$fingerprint" vendor-ticket.json
      - name: Export offline and validate against the pinned NIST OSCAL schemas
        run: |
          schema="$RUNNER_TEMP/oscal-schemas"
          validator="$RUNNER_TEMP/oscal-validator"
          example="$GITHUB_WORKSPACE/docs/examples/governance-handoff"
          mkdir "$schema" "$validator"
          npm install --prefix "$validator" --ignore-scripts --no-package-lock --no-audit --no-fund ajv@8.20.0 ajv-formats@3.0.1
          (
            cd "$schema"
            for model in assessment-plan assessment-results; do
              file="oscal_${model}_schema.json"
              curl -fsSL --retry 3 "https://github.com/usnistgov/OSCAL/releases/download/v1.2.0/$file" -o "$file"
            done
            sha256sum -c <<'SUMS'
          0c83b6b85f8d06c786feb5dd3bdafb44dcf5c0feff4f47ca5cb95cf5379438a5  oscal_assessment-plan_schema.json
          a587b1580651f435a376d04dde78aaba6783c58ceb6f93f482d0b61d0c8afa59  oscal_assessment-results_schema.json
          SUMS
          )
          offline=(sudo -n -- /usr/bin/unshare --net /usr/bin/setpriv --reuid "$(id -u)" \
            --regid "$(id -g)" --clear-groups --no-new-privs /usr/bin/env "PATH=$PATH" COSIGN_PASSWORD=)
          cd "$RUNNER_TEMP/governance-handoff/reviewer"
          "${offline[@]}" setrya receipt export-oscal exchange --key trusted-issuer.pub \
            --assessment-plan "$example/oscal-assessment-plan.json" \
            --mapping "$example/oscal-control-mapping.json" --ticket GOV-204 --output oscal-assessment-results.json
          "${offline[@]}" node "$GITHUB_WORKSPACE/scripts/verify-oscal-schema.mjs" "$validator" "$schema" \
            "$example/oscal-assessment-plan.json" oscal-assessment-results.json
          "${offline[@]}" setrya demo legal-hold --output legal-hold
          for lane in guarded restored-hold; do
            "${offline[@]}" setrya receipt pack "legal-hold/$lane" --synthetic --system incident-register \
              --system-version 1 --key "$RUNNER_TEMP/vendor-key.key" --output "hold-$lane"
            code=0
            "${offline[@]}" setrya receipt verify-exchange "hold-$lane" --key "$RUNNER_TEMP/vendor-key.pub" || code=$?
            if [[ "$lane" == guarded ]]; then test "$code" -eq 0; else test "$code" -eq 1; fi
            "${offline[@]}" setrya receipt export-oscal "hold-$lane" --key "$RUNNER_TEMP/vendor-key.pub" \
              --assessment-plan "$example/oscal-assessment-plan.json" \
              --mapping "$example/oscal-control-mapping.json" --output "hold-$lane.json"
            "${offline[@]}" node "$GITHUB_WORKSPACE/scripts/verify-oscal-schema.mjs" "$validator" "$schema" \
              "$example/oscal-assessment-plan.json" "hold-$lane.json"
            jq -e 'any(.["assessment-results"].results[0].observations[].props[];
              .name == "recorded-maintenance-reads" and .value == "2")' "hold-$lane.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: vendor-conformance-evidence
          path: ${{ runner.temp }}/vendor-reports/
          if-no-files-found: error
