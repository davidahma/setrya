name: Subject erasure
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install '.[erasure,celery-langchain]' boto3 anthropic 'mcp<2'
      - run: python -m pytest -q tests/test_erasure*.py tests/test_shared_investigation.py tests/test_discovery*.py
      - name: Run the installed shared investigation and check both exit contracts
        working-directory: ${{ runner.temp }}
        run: |
          setrya erasure demo --output alice
          setrya replay alice/guarded
          broken=0
          setrya replay alice/broken || broken=$?
          test "$broken" -eq 1
          review=0
          setrya erasure replay alice/guarded --case-review || review=$?
          test "$review" -eq 3
          setrya erasure demo --mode deletion --output deletion
          setrya erasure replay deletion/guarded
      - name: Exercise installed catalog handoff and retain all three discovery outcomes
        working-directory: ${{ runner.temp }}
        run: |
          python -I "$GITHUB_WORKSPACE/scripts/verify-installed-discovery.py"
          setrya discovery demo --output discovery
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checked-discovery
          path: |
            ${{ runner.temp }}/discovery/
            !${{ runner.temp }}/discovery/example/**
          if-no-files-found: error
      - name: Replay the three frozen v0.16.0 receipts
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 -o legacy.zip https://github.com/davidahma/setrya/releases/download/v0.16.0/subject-erasure.zip
          echo 'd8f972093211b6bbe6411943000367204516bb429ebf2f311156e2d93b69755d  legacy.zip' | sha256sum -c -
          unzip -q legacy.zip -d legacy
          for spec in guarded:0 broken:1 opaque:3; do
            code=0
            setrya erasure replay "legacy/${spec%:*}" || code=$?
            test "$code" -eq "${spec##*:}"
          done
      - name: Replay the published v0.17.0 shared receipts with the current verifier
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 -o shared.zip https://github.com/davidahma/setrya/releases/download/v0.17.0/shared-investigation.zip
          echo 'ec47047663fe7314a337dec0402fc2cf5a703d72be69d5bd1d1a872f1b562668  shared.zip' | sha256sum -c -
          unzip -q shared.zip -d frozen-shared
          setrya replay frozen-shared/guarded
          broken=0
          setrya replay frozen-shared/broken || broken=$?
          test "$broken" -eq 1
          review=0
          setrya erasure replay frozen-shared/guarded --case-review || review=$?
          test "$review" -eq 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checked-erasure
          path: ${{ runner.temp }}/alice/
          if-no-files-found: error

  sign:
    needs: drill
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checked-erasure
          path: ${{ runner.temp }}/alice
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checked-discovery
          path: ${{ runner.temp }}/discovery
      - name: Sign each synthetic receipt and verify the workflow identity
        env:
          TUF_ROOT: ${{ runner.temp }}/trust
          SIGNER: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign initialize
          root="$TUF_ROOT/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json"
          for lane in guarded broken; do
            d="$RUNNER_TEMP/alice/$lane"
            args=(--receipt "$d/erasure-receipt.json" --bundle "$d/receipt.sigstore.json")
            python3 -m setrya erasure sign-receipt "${args[@]}"
            python3 -m setrya erasure verify-signature "${args[@]}" --identity "$SIGNER" \
              --issuer https://token.actions.githubusercontent.com --trusted-root "$root"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-erasure
          path: ${{ runner.temp }}/alice/
          if-no-files-found: error
      - name: Sign the finding-bound results
        run: |
          for lane in gap broken guarded; do
            d="$RUNNER_TEMP/discovery/$lane"
            python3 -m setrya discovery sign --receipt "$d/case-result.json" --bundle "$d/receipt.sigstore.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-discovery
          path: |
            ${{ runner.temp }}/discovery/
            !${{ runner.temp }}/discovery/example/**
          if-no-files-found: error

  signed-replay:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-erasure
          path: ${{ runner.temp }}/review
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Verify both downloaded signatures and recompute their technical verdicts
        env:
          TUF_ROOT: ${{ runner.temp }}/reviewer-trust
          SIGNER: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign initialize
          root="$TUF_ROOT/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json"
          for spec in guarded:0 broken:1; do
            d="$RUNNER_TEMP/review/${spec%:*}"
            python3 -m setrya erasure verify --receipt "$d/erasure-receipt.json" --bundle "$d/receipt.sigstore.json" \
              --identity "$SIGNER" --issuer https://token.actions.githubusercontent.com --trusted-root "$root"
            code=0
            python3 -m setrya erasure replay "$d" || code=$?
            test "$code" -eq "${spec##*:}"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-discovery
          path: ${{ runner.temp }}/catalog-review
      - name: Check signatures, replay all outcomes and export the verified ticket attachment
        env:
          TUF_ROOT: ${{ runner.temp }}/reviewer-trust
          SIGNER: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          root="$TUF_ROOT/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json"
          for spec in gap:3 broken:1 guarded:0; do
            d="$RUNNER_TEMP/catalog-review/${spec%:*}"
            python3 -m setrya discovery verify --receipt "$d/case-result.json" --bundle "$d/receipt.sigstore.json" \
              --identity "$SIGNER" --issuer https://token.actions.githubusercontent.com --trusted-root "$root"
            code=0
            python3 -m setrya replay "$d" || code=$?
            test "$code" -eq "${spec##*:}"
            python3 -m setrya discovery export "$d" --output "$RUNNER_TEMP/ticket-${spec%:*}.json"
            cmp "$d/case-result.json" "$RUNNER_TEMP/ticket-${spec%:*}.json"
          done

  graphiti:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run two independently maintained Graphiti revisions against Neo4j
        run: trials/graphiti/run.sh "$RUNNER_TEMP/graphiti"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: graphiti-comparison
          path: ${{ runner.temp }}/graphiti/
          if-no-files-found: error
