name: Subject erasure
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install '.[erasure,celery-langchain]' boto3 anthropic 'mcp<2'
      - run: python -m pytest -q tests/test_erasure*.py
      - name: Run the installed LangGraph example and replay all three receipts
        working-directory: ${{ runner.temp }}
        run: |
          setrya demo erasure --output alice
          setrya replay alice/guarded
          broken=0
          setrya replay alice/broken || broken=$?
          test "$broken" -eq 1
          opaque=0
          setrya replay alice/opaque || opaque=$?
          test "$opaque" -eq 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checked-erasure
          path: ${{ runner.temp }}/alice/
          if-no-files-found: error

  sign:
    needs: drill
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checked-erasure
          path: ${{ runner.temp }}/alice
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign each synthetic receipt and verify the workflow identity
        env:
          TUF_ROOT: ${{ runner.temp }}/trust
          SIGNER: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign initialize
          root="$TUF_ROOT/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json"
          for lane in guarded broken opaque; do
            d="$RUNNER_TEMP/alice/$lane"
            args=(--receipt "$d/erasure-receipt.json" --bundle "$d/receipt.sigstore.json")
            python3 -m setrya erasure sign-receipt "${args[@]}"
            python3 -m setrya erasure verify-signature "${args[@]}" --identity "$SIGNER" \
              --issuer https://token.actions.githubusercontent.com --trusted-root "$root"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-erasure
          path: ${{ runner.temp }}/alice/
          if-no-files-found: error
