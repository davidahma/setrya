[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "setrya"
version = "0.18.0"
description = "Test whether an AI assistant can reveal deleted information and trace a Macie finding through stores, workers, and answers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/davidahma/setrya"
Documentation = "https://github.com/davidahma/setrya#readme"
Issues = "https://github.com/davidahma/setrya/issues"

[project.optional-dependencies]
erasure = ["langgraph>=1.2.24,<2", "langgraph-checkpoint-sqlite>=3.1.3,<4", "pytest>=8", "opentelemetry-api>=1,<2"]
erasure-postgres = ["langgraph-checkpoint-postgres>=3.2.1,<4", "psycopg[binary]>=3.3,<4"]
erasure-elasticsearch = ["elasticsearch>=8.19.3,<9"]
redis = ["redis>=5,<9"]
celery-langchain = ["pytest>=8", "celery[redis]>=5.7,<6", "langchain-core>=1.8.3,<2", "redis>=5,<9"]
pytest = ["pytest>=8"]
answer-cache = ["celery>=5.7,<6", "langchain-core>=1.8.3,<2", "psycopg[binary]>=3.3,<4"]
pgvector = ["psycopg[binary]>=3.3,<4"]

[project.scripts]
setrya = "setrya.cli:console_main"

[tool.setuptools.packages.find]
include = ["setrya*"]

[tool.setuptools.package-data]
"setrya" = ["py.typed"]
"setrya.discovery" = ["*-example.json"]
"setrya.erasure" = ["receipt-v2.schema.json", "receipt-v3.schema.json"]
"setrya.offboarding" = ["receipt-v1.schema.json"]
"setrya.examples" = ["access-v0140/*/*.json", "recorded-search/*.toml", "support-search/*.toml", "pgvector-search/*.toml", "pgvector-search/compose.yml", "offboarding/sqlite/policy.json", "opendesk/*.json", "opendesk/compose.yaml", "opendesk/Dockerfile.trial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
