[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setrya"
version = "0.2.0"
description = "Regression tests for stale search results after document updates"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
pytest = ["pytest>=8"]

[project.scripts]
setrya = "setrya.cli:console_main"

[tool.setuptools.packages.find]
include = ["setrya*", "examples*"]

[tool.setuptools.package-data]
examples = ["support-search/*.toml"]
