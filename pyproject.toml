[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setrya"
version = "0.7.0"
description = "Regression tests for retrieval after document updates and tenant offboarding"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
pytest = ["pytest>=8"]
pgvector = ["psycopg[binary]>=3.3,<4"]

[project.scripts]
setrya = "setrya.cli:console_main"

[tool.setuptools.packages.find]
include = ["setrya*", "examples*"]

[tool.setuptools.package-data]
examples = ["recorded-search/*.toml", "support-search/*.toml", "pgvector-search/*.toml", "pgvector-search/compose.yml", "offboarding/sqlite/policy.json", "opendesk/*.json", "opendesk/compose.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
