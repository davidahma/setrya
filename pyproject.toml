[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "setrya"
version = "1.18.0"
description = "Find where your app and AI agents copy customer data, and prove deletion reaches the copies you test, including stale copies a background job writes back."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/davidahma/setrya"
Documentation = "https://github.com/davidahma/setrya#readme"
Issues = "https://github.com/davidahma/setrya/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
crypto-aws = ["boto3>=1.35,<2"]
case-yaml = ["PyYAML>=6.0.3,<7"]
typescript = ["tree-sitter==0.27.0", "tree-sitter-typescript==0.23.2", "tree-sitter-javascript==0.25.0"]
erasure = ["langgraph>=1.2.24", "langgraph-checkpoint-sqlite>=3.1.3,<4", "pytest>=8", "opentelemetry-api>=1,<2"]
erasure-postgres = ["langgraph-checkpoint-postgres>=3.2.1,<4", "psycopg[binary]>=3.3,<4"]
agentfs = ["agentfs-sdk>=0.6.4,<0.7"]
agent-openai = ["openai-agents>=0.25,<0.26"]
agent-claude = ["claude-agent-sdk>=0.2.187,<0.3"]
traces-langfuse = ["langfuse>=5.2,<5.3"]
erasure-elasticsearch = ["elasticsearch>=8.19.3,<9"]
redis = ["redis>=5,<9"]
celery-langchain = ["pytest>=8", "celery[redis]>=5.7,<6", "langchain-core>=1.8.3,<2", "redis>=5,<9"]
pytest = ["pytest>=8"]
answer-cache = ["celery>=5.7,<6", "langchain-core>=1.8.3,<2", "psycopg[binary]>=3.3,<4"]
pgvector = ["psycopg[binary]>=3.3,<4"]
conformance-mem0 = ["mem0ai>=2.2.1,<2.3"]
conformance-crewai = ["crewai==1.15.45"]
conformance-cognee = ["cognee==1.6.10"]
conformance-adk = ["google-adk==2.15.1", "sqlalchemy[asyncio]>=2,<3", "aiosqlite>=0.22,<0.23"]

[project.scripts]
setrya = "setrya.cli:console_main"

[tool.hatch.build.targets.wheel]
packages = ["setrya"]

[tool.hatch.build.targets.sdist]
include = ["/setrya", "/tests", "/docs", "/scripts", "/trials", "/action.yml", "/.github/workflows", "/SECURITY.md", "/CHANGELOG.md", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
